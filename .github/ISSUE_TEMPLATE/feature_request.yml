name: ✨ Feature request
description: Suggest an idea or improvement for Horizon.
title: 'feat: <short description>'
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you trying to achieve?
      placeholder: I often lose track of which long-term projects depend on short-term ones…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timeline
        - Projects
        - Filters
        - Data (import / export / persistence)
        - UI / UX
        - Developer experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references (Linear, Notion, MS Project…), links.
    validations:
      required: false
