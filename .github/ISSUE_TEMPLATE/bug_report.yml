name: 🐞 Bug report
description: Report something that is not working as expected.
title: 'fix: <short description>'
labels: ['type: bug', 'status: triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues before opening a new one.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I zoom out past the yearly view, the project bars disappear…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the seed data
        2. Press Ctrl + Scroll down over the timeline
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Timeline (zoom / pan / rendering)
        - Project drawer (create / edit / delete)
        - Filters
        - Import / Export / Seed data
        - Theme / UI
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.1.0
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs or exported JSON
      description: Drag files here. Remove any personal data from exported JSON before attaching it.
    validations:
      required: false
