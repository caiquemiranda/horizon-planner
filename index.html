<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Horizon — planeje projetos de curto, médio e longo prazo em uma linha do tempo fluida."
    />
    <meta name="theme-color" content="#09090b" />
    <title>Horizon</title>
    <script>
      // Applies the saved theme before first paint (no flash).
      // Mirrors readStoredTheme + resolveTheme in src/lib/theme.ts — keep in sync.
      (function () {
        var preference = 'dark';
        try {
          var stored = localStorage.getItem('horizon-planner:theme');
          if (stored === 'dark' || stored === 'light' || stored === 'system') preference = stored;
        } catch (error) {}
        var isDark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
